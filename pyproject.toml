[project]
name = "holmhz"
version = "0.1.0"
description = "Synthetic Image Detection System using CNN with Explainable AI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lê Văn Hoàng", email = "2224802010279@student.tdmu.edu.vn" }
]
requires-python = ">=3.10"
keywords = ["deepfake", "detection", "cnn", "xai", "gradcam", "synthetic-image"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML/DL
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.12",                    # Pre-trained models
    "pytorch-grad-cam>=1.4.8",         # Grad-CAM
    
    # Data Processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.1",           # Augmentations
    "scipy>=1.11.0",                   # Frequency transforms
    
    # Training & Experiment
    "wandb>=0.16.0",                   # Experiment tracking
    "hydra-core>=1.3.2",               # Config management
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    
    # Inference & Serving
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    
    # Web Application
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "gradio>=4.8.0",
    "python-multipart>=0.0.6",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",                    # Beautiful logging
    "typer>=0.9.0",                    # CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "pre-commit>=3.6.0",
    "ipykernel>=6.27.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.scripts]
holmhz-train = "scripts.train:main"
holmhz-eval = "scripts.evaluate:main"
holmhz-demo = "scripts.run_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.isort]
known-first-party = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]
