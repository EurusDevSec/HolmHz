# ============================================
# HolmHz Training v3 — OOD Improvement (Fix Fake Bias)
# ============================================
# Thay đổi so với v2:
# - Data: +200 tristanzhang_train (mixed SD+MJ+DALLE, 1024px)
# - OOD test: tristanzhang_fake giảm 500 → 300
# - Mục tiêu: fix model bias predict "Real" cho high-quality fakes

model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 1
  dropout: 0.3
  freeze_backbone: false # Full fine-tune

training:
  epochs: 25 # Tăng từ 20 → 25 (data lớn hơn, cần thêm epochs)
  batch_size: 32
  learning_rate: 0.0001 # 1e-4, giữ nguyên từ v2
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping:
    patience: 8 # Tăng từ 7 → 8
    monitor: val_auc

data:
  train_manifest: data/manifests/train.json
  val_manifest: data/manifests/val.json
  image_size: 224
  num_workers: 4 # Kaggle: 4, Local: 0
  augmentation: true

wandb:
  project: holmhz
  entity: null
  log_every_n_steps: 10
