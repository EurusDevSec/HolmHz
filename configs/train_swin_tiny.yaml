# ============================================
# HolmHz Training — Swin-T (Swin Transformer Tiny)
# ============================================
# Same hyperparams as v4 for fair comparison.
# Swin-T: 28M params, batch_size=16 for Kaggle T4 VRAM.

model:
  name: swin_tiny
  pretrained: true
  num_classes: 1
  dropout: 0.3
  freeze_backbone: false # Full fine-tune

training:
  epochs: 30
  batch_size: 16 # Reduced: Swin-T needs more VRAM than EfficientNet
  learning_rate: 0.0001 # 1e-4
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  pos_weight: 1.2
  early_stopping:
    patience: 10
    monitor: val_auc

data:
  train_manifest: data/manifests/train.json
  val_manifest: data/manifests/val.json
  image_size: 224
  num_workers: 4
  augmentation: true
  use_weighted_sampler: true

wandb:
  project: holmhz
  entity: null
  log_every_n_steps: 10
