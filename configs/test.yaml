# ============================================
# HolmHz Test / Evaluation Configuration
# ============================================

model:
  name: efficientnet_b0
  checkpoint: outputs/checkpoints/best_v4.pt  # v4 is best: OOD AUC 0.7838 > v5's 0.6885
  dropout: 0.3

data:
  test_manifest: data/manifests/test_id.json
  ood_manifest: data/manifests/test_ood.json
  image_size: 224
  batch_size: 32
  num_workers: 0

evaluation:
  metrics: [auc, accuracy, f1, precision, recall]
  threshold: 0.76  # Youden's J optimal (was 0.5). Found by analysis/find_threshold.py
  save_predictions: true
  output_dir: outputs/evaluation

wandb:
  project: holmhz
  log_results: true
