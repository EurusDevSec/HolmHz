model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 1
  dropout: 0.3
  freeze_backbond: true

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping:
    patience: 5
    monitor: val_auc

data:
  train_manifest: data/manifests/train.json
  val_manifest: data/manifests/val.json
  image_size: 224
  num_workers: 4
  augmetation: true

wandb:
  project: holmhz
  entity: null
  log_every_n_steps: 10
