# ============================================
# HolmHz Training v2 — OOD Improvement
# ============================================
# Thay đổi so với v1:
# - Data mới: +3,000 diverse_real + 300 real_pexels_train
# - Augmentation v2: mạnh hơn (JPEG 30-100, Downscale, RandomCrop)
# - Full fine-tune: unfreeze all, LR=1e-4
# - Early stopping patience: 5 → 7

model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 1
  dropout: 0.3
  freeze_backbone: false # Full fine-tune với data v2

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0001 # 1e-4, lower vì unfreeze all
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping:
    patience: 7 # Tăng từ 5 → 7 vì data lớn hơn, cần nhiều epoch hơn
    monitor: val_auc

data:
  train_manifest: data/manifests/train.json
  val_manifest: data/manifests/val.json
  image_size: 224
  num_workers: 4 # Kaggle: 4, Local: 0
  augmentation: true

wandb:
  project: holmhz
  entity: null
  log_every_n_steps: 10
