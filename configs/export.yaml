# ============================================
# HolmHz Model Export Configuration
# ============================================

model:
  name: efficientnet_b0
  checkpoint: outputs/checkpoints/best_v4.pt

export:
  format: onnx
  output_dir: outputs/exports
  opset_version: 17
  input_shape: [1, 3, 224, 224]
  dynamic_axes:
    input: { 0: batch_size }
    output: { 0: batch_size }
  simplify: true

validation:
  enabled: true
  tolerance: 1.0e-5
