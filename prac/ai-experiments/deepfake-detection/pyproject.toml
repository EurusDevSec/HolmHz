[project]
name = "deepfake-detection"
version = "0.1.0"
description = "Deepfake detection project"
readme = "README.md"
requires-python = ">=3.12,<3.13" # Giới hạn để tránh lỗi bản 3.14
dependencies = [
    "torch",
    "torchvision",
    "pillow",
    "numpy",
    "gradio",
]

[tool.uv]
managed = true
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true # Chỉ dùng khi được yêu cầu đích danh

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
